<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E1338" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#2B0922" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="4" y1="8" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FB7185" />
      <stop offset="45%" stopColor="#E11D48" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="8" y1="18" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="60%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="18" y1="26" x2="30" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="60%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
    <linearGradient id="starGrad" x1="32" y1="2" x2="42" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="40%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
    <linearGradient id="shimmer" x1="12" y1="10" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.8" />
