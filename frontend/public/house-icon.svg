  <!-- Squircle Base -->
  <rect width="48" height="48" rx="14" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Roof Structure -->
  <path d="M24 7L8 19.5H13V38C13 39.6569 14.3431 41 16 41H32C33.6569 41 35 39.6569 35 38V19.5H40L24 7Z" fill="url(#roofGrad)" />
  
  <!-- Facet Core -->
  <path d="M24 11L15 18V37.5C15 38.3284 15.6716 39 16.5 39H31.5C32.3284 39 33 38.3284 33 37.5V18L24 11Z" fill="url(#bodyGrad)" />
  
  <!-- Shimmer Highlight -->
