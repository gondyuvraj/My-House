  <!-- Glowing Doorway -->
  <path d="M21 39V28C21 26.3431 22.3431 25 24 25C25.6569 25 27 26.3431 27 28V39H21Z" fill="url(#doorGrad)" />
  <circle cx="24" cy="28.5" r="1.2" fill="#78350F" />

  <!-- Sparkling North Star -->
  <path d="M37 3C37 6 39 8 42 8C39 8 37 10 37 13C37 10 35 8 32 8C35 8 37 6 37 3Z" fill="url(#starGrad)" />
